version: '3.8'

services:
  # ============================================
  # RabbitMQ Service
  # ============================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - vision-network

  # ============================================
  # Vision Service (API + Worker)
  # ============================================
  vision-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vision-service:latest
    container_name: vision-service
    ports:
      - "8001:8001"
    environment:
      # Service
      - SERVICE_NAME=vision-service
      - SERVICE_VERSION=1.0.0
      - HOST=0.0.0.0
      - PORT=8001
      - DEBUG=false

      # Model
      - MODEL_PATH=./models/efficientnet_waha_kun.keras
      - BINARY_MODEL_PATH=./models/binary_classifier.keras
      - CONFIDENCE_THRESHOLD=75.0
      - BINARY_THRESHOLD=0.75

      # Files
      - UPLOAD_FOLDER=./uploads
      - MAX_FILE_SIZE=10485760

      # Image Processing
      - QUALITY_CHECK_ENABLED=true
      - ENHANCE_IMAGE_ENABLED=true

      # RabbitMQ
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest

      # ✅ NEW: Queue Names
      - REQUESTS_QUEUE=vision.analysis.request
      - RESULTS_QUEUE=vision.analysis.result

      # ✅ NEW: Image Download Timeout
      - IMAGE_DOWNLOAD_TIMEOUT=30
    volumes:
      - ../models:/app/models
      - ../uploads:/app/uploads
      - ../logs:/app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vision-network

networks:
  vision-network:
    driver: bridge

volumes:
  rabbitmq_data: