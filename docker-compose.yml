version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: moderation-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - moderation-network

  moderation-api:
    build: .
    container_name: moderation-api
    ports:
      - "8000:8000"
    environment:
      - RABBITMQ_HOST=rabbitmq
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./app/infrastructure/model/WAHA_KUN_AraBERT:/app/app/infrastructure/model/WAHA_KUN_AraBERT:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - moderation-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  moderation-worker:
    build: .
    container_name: moderation-worker
    command: python -m app.workers.moderation_worker
    environment:
      - RABBITMQ_HOST=rabbitmq
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./app/infrastructure/model/WAHA_KUN_AraBERT:/app/app/infrastructure/model/WAHA_KUN_AraBERT:ro
    restart: unless-stopped
    networks:
      - moderation-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

volumes:
  rabbitmq_data:

networks:
  moderation-network:
    driver: bridge