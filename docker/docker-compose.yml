version: '3.8'

services:
  # ============================================
  # RabbitMQ Service
  # ============================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - vision-network

  # ============================================
  # Vision Service  (FastAPI + gRPC + Worker)
  # ============================================
  vision-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vision-service:latest
    container_name: vision-service
    ports:
      - "8001:8001"       # FastAPI (REST)
      - "50051:50051"     # ✅ gRPC
    environment:
      # Service
      - SERVICE_NAME=vision-service
      - SERVICE_VERSION=1.0.0
      - HOST=0.0.0.0
      - PORT=8001
      - DEBUG=false
      - LOG_LEVEL=INFO

      # ✅ gRPC
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50051

      # Model
      - MODEL_PATH=/app/models/efficientnet_waha_kun.keras
      - BINARY_MODEL_PATH=/app/models/binary_classifier.keras
      - CONFIDENCE_THRESHOLD=75.0
      - BINARY_THRESHOLD=0.75

      # Files
      - UPLOAD_FOLDER=/app/uploads
      - MAX_FILE_SIZE=10485760

      # Image Processing
      - QUALITY_CHECK_ENABLED=true
      - ENHANCE_IMAGE_ENABLED=true

      # ✅ CORS (JSON list — required by pydantic-settings)
      - ALLOWED_ORIGINS=["http://localhost:3000"]

      # RabbitMQ
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - REQUESTS_QUEUE=vision.analysis.request
      - RESULTS_QUEUE=vision.analysis.result

      # Image Download Timeout
      - IMAGE_DOWNLOAD_TIMEOUT=15
    volumes:
      - ../models:/app/models:ro
      - ../uploads:/app/uploads
      - ../logs:/app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # Checks the HTTP side. The gRPC side is checked by the entrypoint
      # script before it hands off to the container (see below).
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks:
      - vision-network

networks:
  vision-network:
    driver: bridge

volumes:
  rabbitmq_data: